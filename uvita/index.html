   SÚPER UVITA — plataformas retro de Spot Games
   Un solo archivo. Canvas 320x180 escalado, pixel perfect.

// ---------- Setup canvas ----------
const VW=320, VH=180, TILE=16, VERSION='1.5';
const DEBUG=location.hash==='#debug';   // index.html#debug: tecla N (skip) + window.UVITA para verificar.js

// Escala ENTERA en píxeles FÍSICOS: s = cuántos px físicos mide cada píxel del juego.
// En CSS el tamaño puede quedar fraccional (533,33 px con DPR 3) y eso está bien: son 5 px físicos exactos.
function fit(){
  const dpr=window.devicePixelRatio||1, W=innerWidth, H=innerHeight;
  const s=Math.max(1,Math.floor(Math.min(W*dpr/VW,H*dpr/VH)));
  const cw=VW*s/dpr, ch=VH*s/dpr;
  const left=Math.round((W-cw)/2*dpr)/dpr, top=Math.round((H-ch)/2*dpr)/dpr;   // centrado a px físico
  cv.style.width=cw+'px'; cv.style.height=ch+'px'; cv.style.left=left+'px'; cv.style.top=top+'px';
  // scanlines atadas al lienzo: 1 px físico oscuro cada s px físicos; con escala chica no aportan nada
  const sc=document.getElementById('scan');
  sc.hidden=s<3;
  sc.style.left=left+'px'; sc.style.top=top+'px'; sc.style.width=cw+'px'; sc.style.height=ch+'px';
  sc.style.backgroundImage=s<3?'none':`repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 ${1/dpr}px,transparent ${1/dpr}px ${s/dpr}px)`;
  // cartel "girá el celu": solo táctil, en vertical, y si en horizontal la escala sería mayor
  const sLand=Math.max(1,Math.floor(Math.min(H*dpr/VW,W*dpr/VH)));
  const rot=document.getElementById('rot');
  rot.hidden=!(IS_TOUCH&&H>W&&sLand>s);
  rot.style.top=(top+ch+10)+'px';
}
addEventListener('resize',fit); addEventListener('orientationchange',fit);
document.addEventListener('fullscreenchange',fit);

// iOS ignora las dos cosas y queda el cartel. Nunca rompe: todo en try/catch y promesas con catch.
let fsPedido=false;
function pedirPantallaCompleta(){
  if(fsPedido||!IS_TOUCH)return; fsPedido=true;
  const el=document.documentElement; if(!el.requestFullscreen)return;
  try{
    const r=el.requestFullscreen({navigationUI:'hide'});
    if(r&&r.then)r.then(()=>{try{const l=screen.orientation&&screen.orientation.lock('landscape');if(l&&l.catch)l.catch(()=>{});}catch(e){}}).catch(()=>{});
  }catch(e){}
}

// ---------- Sprite builder ----------
function makeSprite(rows,scale=1){
  const h=rows.length, w=Math.max(...rows.map(r=>r.length));
  const c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale;
  const g=c.getContext('2d');
  for(let yy=0;yy<h;yy++)for(let xx=0;xx<rows[yy].length;xx++){
    const ch=rows[yy][xx]; if(ch==='.'||ch===' ')continue;
    g.fillStyle=PAL[ch]||'#f0f'; g.fillRect(xx*scale,yy*scale,scale,scale);
  }
  return c;
}
function flipSprite(sp){
  const c=document.createElement('canvas'); c.width=sp.width; c.height=sp.height;
  const g=c.getContext('2d'); g.translate(sp.width,0); g.scale(-1,1); g.drawImage(sp,0,0);
  return c;
}

// ---------- Sprites ----------
const SPR={};
// Uvita: frames de 14x15 (hitbox sigue 10x12; el dibujo sobresale 2px por lado y 3 arriba)
// Squash & stretch como FRAMES (no escalando con drawImage, que borra columnas de la cara):
//  sq = aplastada 16×13: duplica las columnas 1 y 12 (contorno) y quita las filas 1 y 3 (tallo/hoja)
//  st = estirada 13×17: quita la columna 6 (cuerpo) y duplica las filas 7 y 12 (cuerpo)
function squashRows(rows){return rows.filter((r,i)=>i!==1&&i!==3).map(r=>r.slice(0,2)+r.slice(1,13)+r.slice(12));}
function stretchRows(rows,col=6){return rows.flatMap((r,i)=>(i===7||i===12)?[r,r]:[r]).map(r=>r.slice(0,col)+r.slice(col+1));}
// Mirando a la izquierda se espeja la CARA, la hoja y el tallo, pero la luz sigue viniendo de arriba-izquierda:
// las filas 5-7 (brillo) no se espejan y el filo claro de las filas de los ojos vuelve al borde izquierdo.
function flipRowsKeepLight(rows){
  return rows.map((r,i)=>{
    if(i>=5&&i<=7)return r;
    let m=r.split('').reverse().join('');
    if(m[12]==='L'&&m[1]==='P')m=m[0]+'L'+m.slice(2,12)+'P'+m[13];
    return m;
  });
}

    st:makeSprite(stretchRows(rows)),stf:makeSprite(stretchRows(fr,7))};
}

// ---------- Tiles (procedurales) ----------
function makeTile(fn){ const c=document.createElement('canvas'); c.width=TILE;c.height=TILE;
  fn(c.getContext('2d')); return c; }
// suelo: 2 variantes (por paridad de tile) con motas distintas + 1 px de luz en la fila 0
const FLECKS=[[[3,7],[9,10],[13,6],[6,12],[11,13],[1,11]],[[6,6],[12,9],[2,8],[9,13],[14,12],[4,11]]];
function tileGround(top,body,fleck){ return FLECKS.map(fl=>makeTile(g=>{
  g.fillStyle=body; g.fillRect(0,0,16,16);
  g.fillStyle=top; g.fillRect(0,0,16,4);
  g.fillStyle='rgba(255,255,255,.22)'; g.fillRect(0,0,16,1);
  g.fillStyle=fleck;
  fl.forEach(p=>g.fillRect(p[0],p[1],2,2));
}));}
function tileBrick(a,b){ return makeTile(g=>{
  g.fillStyle=a; g.fillRect(0,0,16,16); g.fillStyle=b;
  g.fillRect(0,0,16,1); g.fillRect(0,8,16,1);
  g.fillRect(7,1,1,7); g.fillRect(3,9,1,7); g.fillRect(12,9,1,7);
});}
function tilePlank(){ return makeTile(g=>{
  g.fillStyle=PAL.Y; g.fillRect(0,0,16,5);
  g.fillStyle=PAL.y; g.fillRect(0,0,16,1);
  g.fillStyle=PAL.o; g.fillRect(0,4,16,1);
  g.fillRect(2,1,1,3); g.fillRect(13,1,1,3);
});}
// pinchos en escalones de píxel (sin antialiasing): punta en y=6, coherente con el umbral de daño (+7)
function tileSpike(){ return makeTile(g=>{
  for(let i=0;i<4;i++){ const x=i*4;
    g.fillStyle=PAL.S; g.fillRect(x+1,6,2,4); g.fillRect(x,10,4,6);
    g.fillStyle=PAL.W; g.fillRect(x+1,7,1,3);

// Ruteo: SFX + MÚSICA → compresor → MASTER → salida. Mute = MASTER en 0 (y además no se agenda nada).
// El audio NUNCA consume Math.random (el ruido tiene su propio generador): con o sin sonido la partida es la misma.
let AC=null, BUS=null, muted=store.get('spotUvitaMute')==='1';
function audio(){
  if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;return null;} buildBus(); }
  // iOS deja el contexto en 'interrupted' tras una llamada o bloqueo: reanudar en cualquier estado que no sea running
  if(AC.state!=='running'){ try{const r=AC.resume(); if(r&&r.catch)r.catch(()=>{});}catch(e){} }
  return AC;
}
// onda de pulso (25 % = lead chiptune, 12,5 % = más nasal) por serie de Fourier
function pulseWave(ac,duty){
  const N=32, re=new Float32Array(N), im=new Float32Array(N);
  for(let n=1;n<N;n++){re[n]=Math.sin(2*Math.PI*n*duty)/(Math.PI*n);im[n]=(1-Math.cos(2*Math.PI*n*duty))/(Math.PI*n);}
  try{return ac.createPeriodicWave(re,im);}catch(e){return null;}
}
function buildBus(){
  const ac=AC, master=ac.createGain(), sfx=ac.createGain(), mus=ac.createGain();
  master.gain.value=muted?0:1; master.connect(ac.destination);
  let entrada=master;
  try{ const comp=ac.createDynamicsCompressor();
    comp.threshold.value=-14; comp.knee.value=8; comp.ratio.value=4; comp.attack.value=.004; comp.release.value=.14;
    comp.connect(master); entrada=comp; }catch(e){}
  sfx.connect(entrada); mus.connect(entrada);
  // UN solo buffer de ruido (1 s) para pisotones y percusión, con generador propio (xorshift)
  const n=ac.sampleRate, buf=ac.createBuffer(1,n,n), d=buf.getChannelData(0);
  let r=0x2545F491;
  for(let i=0;i<n;i++){r^=r<<13;r^=r>>>17;r^=r<<5;d[i]=(r>>>0)/2147483648-1;}
  BUS={master,sfx,mus,noise:buf,pulse:pulseWave(ac,.25),thin:pulseWave(ac,.125)};
}

// una nota en el reloj del AudioContext. type: square · triangle · sawtooth · sine · pulse (25 %) · thin (12,5 %)
function tone(bus,f,at,dur,type,vol,slide=0){
  const o=AC.createOscillator(), g=AC.createGain(), pw=(type==='pulse'||type==='thin');
  if(pw&&BUS[type])o.setPeriodicWave(BUS[type]); else o.type=pw?'square':type;
  o.frequency.setValueAtTime(f,at);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),at+dur);
  g.gain.setValueAtTime(vol,at); g.gain.exponentialRampToValueAtTime(.001,at+dur);
  o.connect(g); g.connect(bus); o.start(at); o.stop(at+dur+.02);
}
// un golpe de ruido filtrado (pisotón, hat, redoblante)
function hit(bus,at,dur,vol,from,to,type='lowpass'){
  const src=AC.createBufferSource(), f=AC.createBiquadFilter(), g=AC.createGain();
  src.buffer=BUS.noise; f.type=type; f.frequency.setValueAtTime(from,at); f.frequency.exponentialRampToValueAtTime(to,at+dur);
  g.gain.setValueAtTime(vol,at); g.gain.exponentialRampToValueAtTime(.001,at+dur);
  src.connect(f); f.connect(g); g.connect(bus); src.start(at); src.stop(at+dur+.02);
}
function beep(freq,dur,type='square',vol=.14,slide=0,delay=0){
  if(muted)return; const ac=audio(); if(!ac||!BUS)return;

}
function noise(dur,vol=.18,fall=800,delay=0){
  if(muted)return; const ac=audio(); if(!ac||!BUS)return;

}

function seq(notes,gap,dur,type='square',vol=.11){ notes.forEach((f,i)=>{if(f)beep(f,dur,type,vol,0,i*gap);}); }

   g bicho caminador · f volador · X jefe */
function buildLevel(w,h,fn){
  const g=Array.from({length:h},()=>Array(w).fill(' '));
  const api={
    ground(x1,x2){for(let x=x1;x<=x2;x++){g[h-3][x]='#';g[h-2][x]='#';}},
    block(x,y){g[y][x]='B';},
    col(x,y1,y2){for(let y=y1;y<=y2;y++)g[y][x]='B';},
    plat(x1,x2,y){for(let x=x1;x<=x2;x++)g[y][x]='=';},
    row(x1,x2,y,ch){for(let x=x1;x<=x2;x++)g[y][x]=ch;},
    put(x,y,ch){g[y][x]=ch;},
  };
  fn(api,h-3);
  return g.map(r=>r.join(''));
}

const SPAWN={

function loadLevel(i,fromCheckpoint=false){
  const L=LEVELS[i]; levelIdx=i;theme=THEMES[L.theme];visited.add(L.id);
  if(!fromCheckpoint){stageFrames=0;stageHits=0;stageCoinStart=coins;stageCartStart=cartsGot;stageSummary=null;}
  const rows=L.rows.slice();
  mapW=Math.max(...rows.map(r=>r.length));
  map=rows.map(r=>r.padEnd(mapW,' ').split(''));
  mapH=map.length;
  ents=[]; parts=[]; popups=[]; hitstop=shake=flashT=bossBanner=0; bossRef=null; exitPos=null; exitOpen=true;
  let spawn={x:32,y:32};
  for(let y=0;y<mapH;y++)for(let x=0;x<mapW;x++){
    const t=map[y][x];
    const spawnTile=SPAWN[t];
    if(spawnTile){const found=spawnTile(x,y,i,L);if(found)spawn=found;map[y][x]=' ';}
  }
  if(L.mission)exitOpen=ents.filter(e=>e.kind==='station').every(e=>e.on);
  if(fromCheckpoint&&checkpoint){spawn={x:checkpoint.x,y:checkpoint.y};
    // re-marcar bandera activa
    ents.forEach(e=>{if(e.kind==='flag'&&Math.abs(e.x-checkpoint.x)<20)e.on=true;});
  } else checkpoint=null;
  player=mkPlayer(spawn.x,spawn.y);
  cam.x=Math.max(0,player.x-VW/2); cam.y=Math.max(-8,Math.min(mapH*TILE-VH,player.y-VH/2));

}

const GRAV=.34, MAXFALL=5.5, ACC=.38, FRIC=.72, MAXV=2.15, JUMP=-6.1;
function moveSolid(e){
  e.hitWall=0;
  // eje X
  e.x+=e.vx;
  let l=Math.floor(e.x/TILE), r=Math.floor((e.x+e.w-1)/TILE);
  let t=Math.floor(e.y/TILE), b=Math.floor((e.y+e.h-1)/TILE);
  if(e.vx>0){for(let yy=t;yy<=b;yy++)if(solidAt(r,yy)){e.x=r*TILE-e.w;e.vx=0;e.hitWall=1;break;}}
  else if(e.vx<0){for(let yy=t;yy<=b;yy++)if(solidAt(l,yy)){e.x=(l+1)*TILE;e.vx=0;e.hitWall=1;break;}}
  // eje Y
  e.y+=e.vy;
  l=Math.floor(e.x/TILE); r=Math.floor((e.x+e.w-1)/TILE);
  t=Math.floor(e.y/TILE); b=Math.floor((e.y+e.h-1)/TILE);
  e.grounded=false;
  if(e.vy>0){
    for(let xx=l;xx<=r;xx++){
      if(solidAt(xx,b)){e.y=b*TILE-e.h;e.vy=0;e.grounded=true;break;}
      // plataforma una-vía: solo si los pies cruzan el borde superior
      if(tileAt(xx,b)==='='&&(e.y+e.h-e.vy)<=b*TILE+1){e.y=b*TILE-e.h;e.vy=0;e.grounded=true;break;}
    }
  } else if(e.vy<0){
    for(let xx=l;xx<=r;xx++)if(solidAt(xx,t)){e.y=(t+1)*TILE;e.vy=0;break;}
  }
}

function pollPad(){
  let gp;
  try{gp=Array.from(navigator.getGamepads?navigator.getGamepads():[]).find(g=>g&&g.connected&&g.mapping==='standard');}catch(e){}
  pad.connected=!!gp;
  if(!gp||inputSuspended||document.hidden){pad.l=pad.r=pad.a=pad.start=false;return;}
  const down=i=>!!(gp.buttons[i]&&gp.buttons[i].pressed);
  const a=down(0)||down(1), start=down(9), axis=gp.axes[0]||0;
  const l=down(14)||axis<-.3, r=down(15)||axis>.3;
  if(pad.waitNeutral){pad.l=pad.r=pad.a=pad.start=false;if(!a&&!start&&!l&&!r)pad.waitNeutral=false;return;}
  if(start&&!pad.start&&[ST.PLAY,ST.PAUSE,ST.RESPAWN,ST.DYING].includes(state))togglePause();
  else if(a&&!pad.a){audio();if(state===ST.PLAY)pressJump();else advanceScreens();}
  pad.l=l&&!r;pad.r=r&&!l;pad.a=a;pad.start=start;
}

  touch.l=dirs.includes('l')&&!dirs.includes('r');touch.r=dirs.includes('r')&&!dirs.includes('l');paintTouch();
}

  cartsTotal=LEVELS.reduce((n,L)=>n+L.rows.join('').split('C').length-1,0);
  cartsSeen=new Set();memoriesSeen=new Set();stationsSeen=new Set();visited=new Set();teaSeen=new Set();printerProgress=new Map();notice='';noticeT=0;
  checkpoint=null; loadLevel(0); state=ST.INTRO; stateT=0;
  if(AC){MUS.next=AC.currentTime+.35;MUS.step=0;}
  SFX.start();
}
function nextLevel(){
  levelIdx++;
  if(levelIdx>=LEVELS.length){ state=ST.WIN; stateT=0; SFX.win();
    score+=lives*300; saveHi();
    return; }
  checkpoint=null; loadLevel(levelIdx); state=ST.INTRO; stateT=0;
}

// ---------- Update ----------
// srcX = centro del enemigo que golpeó (el empujón va LEJOS de él); sin srcX (pinchos) = hacia atrás
function hurtPlayer(srcX){
  if(player.inv>0||state!==ST.PLAY)return;
  stageHits++;lives--; SFX.hurt(); burst(player.x+5,player.y+6,PAL.L,12,2.5);
  impact(5,4,7);
  if(lives<=0){beginRespawn();SFX.die();return;}
  const away=srcX===undefined?-player.dir:(player.x+5<srcX?-1:1);
  player.inv=90; player.vy=-4; player.vx=2*away;
}
function killFall(){
  if(state!==ST.PLAY)return;
  stageHits++;lives--; SFX.die();
  beginRespawn();
}
// Animación visual independiente de la física: arco de 44 px, cierre y apertura de 24 cuadros.
function beginRespawn(){
  respawn={t:0,x:player.x,y:Math.min(player.y,cam.y+VH-26),dir:player.dir};
  state=lives<=0?ST.DYING:ST.RESPAWN;stateT=0;soltarTodo();
}
function updateRespawn(){
  respawn.t++;
  if(respawn.t===72){
    if(lives<=0){state=ST.GAMEOVER;stateT=0;respawn=null;saveHi();SFX.gameover();return;}
    loadLevel(levelIdx,true);player.inv=120;soltarTodo();
  }
  if(respawn.t>=96){state=ST.PLAY;stateT=0;respawn=null;soltarTodo();musicResync();}
}
function drawRespawn(){
  if(!respawn)return;
  const t=respawn.t;
  if(t<48){
    const y=respawn.y-5.6*t+.18*t*t;
    ctx.drawImage(respawn.dir<0?UVA.hurt.f:UVA.hurt.n,Math.round(respawn.x-cam.x-2),Math.round(y-cam.y-2));
  }
  // Iris cuadrado escalonado, centrado en el lugar de caída y luego en el checkpoint.
  const amount=t<48?0:t<72?(t-48)/24:(96-t)/24;
  if(amount<=0)return;
  const cx=Math.round((t<72?respawn.x:player.x)+5-cam.x);
  const cy=Math.round((t<72?respawn.y:player.y)+6-cam.y);
  const radius=Math.ceil((1-amount)*Math.max(VW,VH)/8)*8;
  ctx.fillStyle='#0d0714';
  for(let y=0;y<VH;y+=8){
    const span=Math.max(0,radius-Math.abs(y+4-cy));
    const l=Math.max(0,Math.min(VW,cx-span)),r=Math.max(0,Math.min(VW,cx+span));
    ctx.fillRect(0,y,l,8);ctx.fillRect(r,y,VW-r,8);
  }
}

function update(){
  pollPad();
  syncMenu();
  frame++; stateT++;
  musicTick();
  if(state===ST.PLAY||state===ST.DYING){
    if(shake>0)shake=Math.max(0,shake-.4);if(flashT>0)flashT--;if(bossBanner>0)bossBanner--;
    for(const q of popups){q.y-=.35;q.life--;}
    popups=popups.filter(q=>q.life>0);
  }
  if(state===ST.DYING||state===ST.RESPAWN){if(respawn)updateRespawn();return;}
  if(state===ST.GAMEOVER){if(stateT>640)toTitle();return;}
  // transiciones y animaciones de pantallas viven acá (nunca en render: 120 Hz o sin render las rompen)
  if(state===ST.INTRO){ if(stateT>(firstIntro?240:60)){state=ST.PLAY;player.jbuf=0;firstIntro=false;} return; }
  if(state===ST.WIN){
    if(stateT%5===0)burst(Math.random()*VW+cam.x,cam.y+20,[PAL.y,PAL.P,PAL.g][Math.floor(Math.random()*3)],3,1.5);
    for(const q of parts){q.x+=q.vx;q.y+=q.vy;q.vy+=.05;q.life--;}
    parts=parts.filter(q=>q.life>0);
    return;
  }
  if(state!==ST.PLAY)return;
  stageFrames++;runFrames++;
  if(hitstop>0){hitstop--;return;}

  const p=player;
  if(noticeT>0)noticeT--;
  // mover
  if(left()){p.vx-=ACC;p.dir=-1;} else if(right()){p.vx+=ACC;p.dir=1;}
  else p.vx*=FRIC;
  p.vx=Math.max(-MAXV,Math.min(MAXV,p.vx));
  // salto: coyote + buffer + altura variable
  if(p.grounded)p.coyote=7; else if(p.coyote>0)p.coyote--;
  if(p.jbuf>0)p.jbuf--;
  if(p.jbuf>0&&p.coyote>0){
    p.vy=JUMP;p.coyote=0;p.jbuf=0;p.noCut=false;SFX.jump();p.squash=-5;
    burst(p.x+5,p.y+12,PAL.D,4,1);
  }
  // salto de altura variable (el rebote sobre un enemigo no se recorta: noCut)
  if(!jumpHeld()&&p.vy<-3.1&&!p.noCut)p.vy=-3.1;
  p.vy=Math.min(MAXFALL,p.vy+GRAV);
  const wasAir=!p.grounded;
  moveSolid(p);
  if(p.grounded&&wasAir){p.squash=5;p.noCut=false;p.combo=0;burst(p.x+5,p.y+12,PAL.d,3,.8);}
  if(p.squash>0)p.squash--; if(p.squash<0)p.squash++;
  if(p.inv>0)p.inv--;
  p.x=Math.max(0,Math.min(mapW*TILE-p.w,p.x));
  // arena del jefe: despierto, no se puede volver a la izquierda
  if(bossRef&&bossRef.awake&&!bossRef.dead)p.x=Math.max(p.x,ARENA_L);
  p.anim+=Math.abs(p.vx)*.15;

  // caída al vacío
  if(p.y>mapH*TILE+40){killFall();return;}

  // pinchos (un solo golpe aunque los pies pisen dos tiles)
  {
    const tx1=Math.floor(p.x/TILE),tx2=Math.floor((p.x+p.w-1)/TILE);
    const ty=Math.floor((p.y+p.h-1)/TILE);
    for(let xx=tx1;xx<=tx2;xx++)if(tileAt(xx,ty)==='^'&&(p.y+p.h)>ty*TILE+7){hurtPlayer();break;}
  }

  for(const e of ents){
    if(state!==ST.PLAY)break;
    KINDS[e.kind].upd(e,p);
  }
  ents=ents.filter(e=>!e.gone);

  // salida
  if(exitPos&&exitOpen){
    const ex={x:exitPos.x,y:exitPos.y-26,w:14,h:36};
    if(aabb(p,ex)){completeLevel();return;}
  }

  // partículas
  for(const q of parts){q.x+=q.vx;q.y+=q.vy;q.vy+=.12;q.life--;}
  parts=parts.filter(q=>q.life>0);

  // cámara
  const tx=p.x-VW/2+5+p.dir*24;
  if(p.grounded||(p.vy>0&&p.y-VH/2>cam.targetY+24))cam.targetY=p.y-VH/2;
  cam.x+=(tx-cam.x)*.12;cam.y+=(cam.targetY-cam.y)*.12;
  cam.x=Math.max(0,Math.min(mapW*TILE-VW,cam.x));
  cam.y=Math.max(-8,Math.min(mapH*TILE-VH,cam.y));
}
function touchEnemy(e,pts){
  const p=player;
  if(aabb(p,e)&&!e.dead){
    if(p.vy>1&&(p.y+p.h)<e.y+6){
      e.dead=1;p.vy=-4.6;p.noCut=true;score+=pts;SFX.stomp(p.combo++);
      popup('+'+pts,e.x+5,e.y-8,e.kind==='fly'?PAL.C:PAL.y);impact(2,2);
      burst(e.x+5,e.y+3,e.kind==='fly'?PAL.C:PAL.M,8,2);
    } else hurtPlayer(e.x+e.w/2);
  }
}

function makeScenery(kind){

    const label=(s,x,y,color)=>{for(const ch of s){const cv=glyph(ch,color);if(cv){g.drawImage(cv,x,y);x+=cv.width+1;}else x+=4;}};
    paint(r,label);layers.push({canvas:c,speed});
  };
  // Objetos de fondo deliberadamente desaturados, sin el amarillo de las fichas.

function drawMap(){
  const x0=Math.floor(cam.x/TILE), x1=Math.ceil((cam.x+VW)/TILE);
  const y0=Math.floor(Math.max(0,cam.y)/TILE), y1=Math.ceil((cam.y+VH)/TILE);
  for(let y=y0;y<=Math.min(y1,mapH-1);y++)for(let x=x0;x<=Math.min(x1,mapW-1);x++){
    const t=map[y][x]; if(t===' ')continue;
    const dx=Math.round(x*TILE-cam.x), dy=Math.round(y*TILE-cam.y);
    if(t==='#')ctx.drawImage(theme.ground[(x+y)&1],dx,dy);
    else if(t==='B')ctx.drawImage(theme.brick,dx,dy);
    else if(t==='=')ctx.drawImage(plankTile,dx,dy);
    else if(t==='^')ctx.drawImage(spikeTile,dx,dy);

function drawPlayer(){
  if(respawn&&respawn.t<72)return;
  const p=player;
  if(p.inv>0&&frame%6<3)return;
  // frame segun estado
  let fr;
  if(state===ST.DYING||p.inv>50)fr=UVA.hurt;
  else if(!p.grounded)fr=p.vy<0?UVA.jump:UVA.fall;
  else if(Math.abs(p.vx)>.4)fr=[UVA.walk1,UVA.idle,UVA.walk3,UVA.idle][Math.floor(p.anim/1.6)&3];
  else fr=(frame%150<8)?UVA.blink:UVA.idle;
  const dx=Math.round(p.x-cam.x-2), dy=Math.round(p.y-cam.y-2);
  let sp,ox=0,oy=0;
  if(p.squash>0){sp=p.dir<0?fr.sqf:fr.sq;ox=-1;oy=2;}      // aplastada al caer (16×13)
  else if(!p.grounded){sp=p.dir<0?fr.stf:fr.st;oy=-2;}      // estirada en el aire (13×17)
  else sp=p.dir<0?fr.f:fr.n;
  const bob=(p.grounded&&Math.abs(p.vx)>.4)?Math.round(Math.sin(p.anim)*1.2):0;
  ctx.drawImage(sp,dx+ox,dy+oy+bob);
}

const GLYPH_ROWS={}, GLYPH_CV=new Map();
// filas del glifo: 2 de acento + 7 de letra; null si el carácter no existe (se dibuja como espacio)
function glyphRows(ch){
  if(ch in GLYPH_ROWS)return GLYPH_ROWS[ch];
  const acc=FONT_ACC[ch], src=FONT_SRC[acc?acc[0]:ch];
  if(!src)return GLYPH_ROWS[ch]=null;
  const base=src.split('/'), w=base[0].length, pad=' '.repeat(Math.max(0,(w-3)>>1));
  const top=acc?FONT_MARK[acc[1]].map(r=>pad+r):['',''];
  return GLYPH_ROWS[ch]=top.concat(base);
}
// color = un hex, o una lista de 9 colores (uno por fila: así se hace el dorado del título)
function glyph(ch,color){
  const key=ch+'|'+color; let c=GLYPH_CV.get(key); if(c!==undefined)return c;
  const rows=glyphRows(ch);
  if(!rows){GLYPH_CV.set(key,null);return null;}
  c=document.createElement('canvas'); c.width=rows[2].length; c.height=9;
  const g=c.getContext('2d');
  rows.forEach((r,yy)=>{ g.fillStyle=Array.isArray(color)?color[yy]:color;
    for(let xx=0;xx<r.length;xx++)if(r[xx]==='#')g.fillRect(xx,yy,1,1); });
  GLYPH_CV.set(key,c); return c;
}
function textScale(size){return size>=20?3:size>=11?2:1;}
function textWidth(s,sc){ let w=0; for(const ch of s){const r=glyphRows(ch);w+=(r?r[2].length:3)+1;} return Math.max(0,w-1)*sc; }
function text(s,x,y,color='#fff',size=8,align='left'){
  s=String(s).toUpperCase().replace(/[—–]/g,'-');
  const sc=textScale(size);
  let px=Math.round(align==='center'?x-textWidth(s,sc)/2:align==='right'?x-textWidth(s,sc):x);
  for(const ch of s){
    const g=glyph(ch,color);
    if(g){ctx.drawImage(g,px,y-2*sc,g.width*sc,g.height*sc);px+=(g.width+1)*sc;} else px+=4*sc;
  }
}

}

// Patrulla compartida; el contacto lo decide cada tipo en KINDS.
function updateWalker(e){
  if(e.dead){e.dead++;if(e.dead>18)e.gone=true;return false;}
  e.vy=Math.min(MAXFALL,e.vy+GRAV);
  const pv=e.vx;
  moveSolid(e);
  if(e.hitWall)e.vx=-pv;
  else if(e.grounded){
    const ahead=e.vx>0?Math.floor((e.x+e.w+1)/TILE):Math.floor((e.x-1)/TILE);
    const below=Math.floor((e.y+e.h+2)/TILE);
    if(!solidAt(ahead,below)&&tileAt(ahead,below)!=='=')e.vx=-e.vx;
  }
  if(Math.abs(e.x-e.home)>48)e.vx=Math.sign(e.home-e.x)*.5;
  return true;
}
const KINDS={
  spiky:{
    upd(e,p){if(updateWalker(e)&&aabb(p,e))hurtPlayer(e.x+e.w/2);},
    draw(e,dx,dy){
      ctx.fillStyle='rgba(0,0,0,.25)';ctx.fillRect(dx+1,dy+7,8,1);
      ctx.drawImage(e.vx>0?SPR.spikyF:SPR.spiky,dx,dy);
      if(Math.abs(player.x-e.x)<110)textShadow('¡NO LO PISES!',dx+5,dy-15,PAL.y,6,'center');
    },
  },
  coin:{
    upd(e,p){ e.t+=.15;
      if(aabb(p,e)){
        e.gone=true;coinsSeen.add(e.ck);coins++;score+=10;SFX.coin();burst(e.x+4,e.y+4,PAL.y,6,1.5);
        popup('+10',e.x+4,e.y-6);
        if(coins%EXTRA_LIFE_COINS===0&&lives<MAX_LIVES){lives++;popup('+1 VIDA',p.x+5,p.y-20,PAL.g);SFX.life();}
      }

    },
    draw(e,dx,dy){
      const ph=Math.abs(Math.sin(e.t)); const w=Math.max(2,Math.round(8*ph)); const cx0=dx+4-(w>>1);
      ctx.fillStyle=PAL.Y; ctx.fillRect(cx0,dy,w,8);
      ctx.fillStyle=PAL.y; ctx.fillRect(cx0,dy,w,2);
      if(w>4){ctx.fillStyle=PAL.o;ctx.fillRect(dx+3,dy+3,2,3);}

    }
  },
  cart:{
    upd(e,p){ e.t+=.08;
      if(aabb(p,e)){e.gone=true;cartsGot++;cartsSeen.add(e.ck);score+=500;SFX.cart();burst(e.x+5,e.y+5,PAL.C,12,2);popup('+500',e.x+5,e.y-8,PAL.C);}

    },
    draw(e,dx,dy){
      const bob=Math.round(Math.sin(e.t*2)*2);
      ctx.drawImage(SPR.cart,dx,dy+bob);
      ctx.fillStyle='rgba(242,212,114,'+(0.25+0.2*Math.sin(e.t*4))+')';
      ctx.fillRect(dx-1,dy+bob-1,12,1);

    }
  },
  pulse:{
    upd(e,p){
      e.t=(e.t+1)%180;
      if(e.t>=125&&aabb(p,e))hurtPlayer(e.x+8);

    },
    drawLocal(e,x,y){
      const active=e.t>=125,warning=e.t>=100;
      ctx.fillStyle=active?'#f36c90':warning?'#f2c66f':'#566278';ctx.fillRect(x,y+5,16,3);
      if(active){ctx.fillRect(x+2,y,3,6);ctx.fillRect(x+10,y-1,3,7);}
      else if(warning&&frame%12<6){ctx.fillRect(x+6,y-6,3,7);}

    }
  },
  wave:{
    upd(e,p){
      e.x+=e.vx;e.life--;
      if(aabb(p,e))hurtPlayer(e.x+e.w/2);
      if(e.life<=0||e.x<ARENA_L||e.x>mapW*TILE)e.gone=true;

    },
    drawLocal(e,x,y){
      ctx.fillStyle='#f2b178';ctx.fillRect(x,y+2,11,3);ctx.fillStyle='#f2d472';ctx.fillRect(x+3,y,5,3);

    }
  },
  station:{
    upd(e,p){
      // Hay que subir hasta el banco o tablero; pasar por el piso no lo activa.
      if(!e.on&&aabb(p,{x:e.x-3,y:e.y,w:20,h:28})){
        e.on=true;stationsSeen.add(e.ck);score+=50;SFX.check();
        notice=missionLabel()+' '+missionCount()+'/3';noticeT=150;
        if(missionCount()===3){exitOpen=true;notice='¡PASO ABIERTO!';if(currentLevel().id==='fixes')remember('fixes');}
      }

    },
    drawLocal(e,x,y){
      if(currentLevel().mission==='lights'){
        ctx.fillStyle='#526173';ctx.fillRect(x+6,y-29,2,27);
        ctx.fillStyle=e.on?'#f5d68a':'#5b6878';ctx.fillRect(x,y-32,14,4);
        if(e.on){ctx.fillStyle='rgba(245,214,138,.12)';ctx.fillRect(x-9,y-28,32,25);}
      }
      ctx.fillStyle='#111f2c';ctx.fillRect(x-2,y,18,28);
      ctx.fillStyle=e.on?'#6bd898':'#ecb866';ctx.fillRect(x,y+2,14,4);
      ctx.fillStyle='#65798b';ctx.fillRect(x+2,y+9,10,13);
      ctx.fillStyle=e.on?'#8de3aa':'#ead3a0';ctx.fillRect(x+5,y+(e.on?10:16),4,6);
      textShadow(e.on?'OK':'TOCÁ',x+7,y-11,e.on?'#8de3aa':'#f2d472',6,'center');

    }
  },
  memory:{
    upd(e,p){
      if(aabb(p,e)){remember(e.id);e.gone=true;}

    },
    drawLocal(e,x,y){
      const bob=Math.round(Math.sin(frame*.07)*2);
      ctx.fillStyle='#151728';ctx.fillRect(x-3,y+bob-3,20,18);drawMemory(e.id,x,y+bob);
      textShadow('RECUERDO',x+5,y-14,'#e8d5fa',6,'center');

    }
  },
  printer:{
    upd(e,p){
      const near=aabb(p,{x:e.x-4,y:e.y-4,w:28,h:32});
      let progress=printerProgress.get(e.ck)||0;
      if(!progress&&near){progress=1;SFX.check();notice='IMPRIMIENDO MINI UVITA...';noticeT=130;}
      if(progress>0&&progress<120)progress++;
      printerProgress.set(e.ck,progress);
      if(progress>=120&&near)remember('games');

    },
    drawLocal(e,x,y){
      const progress=printerProgress.get(e.ck)||0,done=memoriesSeen.has('games');
      ctx.fillStyle='#8d99b3';ctx.fillRect(x,y,2,24);ctx.fillRect(x+20,y,2,24);ctx.fillRect(x,y,22,3);ctx.fillRect(x-2,y+24,26,4);
      ctx.fillStyle='#839eb2';ctx.fillRect(x+2,y+5,18,2);
      ctx.fillStyle='#bc86cf';ctx.fillRect(x+3+(progress>0&&progress<120?Math.floor(progress/4)%14:7),y+5,3,6);
      if(progress>=120)drawMemory('games',x+4,y+12);
      ctx.fillStyle='#68cabb';ctx.fillRect(x,y+29,Math.round(22*progress/120),2);
      textShadow(done?'¡TU MINI UVITA!':progress>=120?'RETIRÁ TU UVITA':progress?'IMPRIMIENDO':'TOCÁ Y ESPERÁ',x+11,y-12,'#d6c3f0',6,'center');

    }
  },
  tea:{
    upd(e,p){
      if(!e.on&&aabb(p,e)){
        e.on=true;teaSeen.add(levelIdx);lives=Math.min(MAX_LIVES,lives+1);
        checkpoint={x:e.x,y:e.y+8};player.inv=Math.max(player.inv,90);SFX.life();
        notice='CAFÉ LISTO · CHECKPOINT';noticeT=150;
      }

    },
    drawLocal(e,x,y){
      ctx.fillStyle='#92725c';ctx.fillRect(x-5,y+16,29,3);ctx.fillRect(x-2,y+19,2,13);ctx.fillRect(x+19,y+19,2,13);
      drawMemory('nissi',x+2,y+2,e.on);
      textShadow(e.on?'BUEN VIAJE':'CAFÉ · +1 VIDA',x+8,y-11,'#e9d9ae',6,'center');

    }
  },
  flag:{
    upd(e,p){
      const fbox={x:e.x-2,y:e.y-40,w:10,h:52};
      if(!e.on&&aabb(p,fbox)){e.on=true;checkpoint={x:e.x-2,y:e.y-2};SFX.check();
        burst(e.x+3,e.y+2,PAL.P,10,1.8);}

    },
    draw(e,dx,dy){ ctx.drawImage(e.on?SPR.flagOn:SPR.flagOff,dx,dy);
    }
  },
  bug:{
    upd(e){if(updateWalker(e))touchEnemy(e,50);},
    draw(e,dx,dy){
      if(e.dead){ctx.globalAlpha=1-e.dead/18;
        ctx.drawImage(SPR.bug,dx,dy+(e.dead>>1));ctx.globalAlpha=1;return;}
      const step=(Math.floor(frame/8)%2)!==0;
      ctx.fillStyle='rgba(0,0,0,.25)';ctx.fillRect(dx+1,dy+7,8,1);
      const sp=step?(e.vx>0?SPR.bugStepF:SPR.bugStep):(e.vx>0?SPR.bugF:SPR.bug);
      ctx.drawImage(sp,dx,dy+e.h-sp.height);

    }
  },
  fly:{
    upd(e,p){
      if(e.dead){e.dead++;e.y+=3;if(e.dead>20)e.gone=true;return;}
      e.t+=.06; e.x+=e.vx; e.y=e.baseY+Math.sin(e.t)*22;
      // ancla: patrulla x0±40
      if(Math.abs(e.x-e.x0)>40)e.vx=Math.sign(e.x0-e.x)*.6;
      if(e.x<8||e.x>mapW*TILE-16)e.vx=-e.vx;
      // girar cerca de paredes
      const ahead=e.vx>0?Math.floor((e.x+e.w+2)/TILE):Math.floor((e.x-2)/TILE);
      if(solidAt(ahead,Math.floor((e.y+3)/TILE)))e.vx=-e.vx;
      touchEnemy(e,80);

    },
    draw(e,dx,dy){
      if(e.dead){ctx.globalAlpha=1-e.dead/20;ctx.drawImage(SPR.fly,dx,dy);ctx.globalAlpha=1;return;}
      const flap=(Math.floor(frame/6)%2)!==0;
      ctx.drawImage(flap?(e.vx>0?SPR.flyFlapF:SPR.flyFlap):(e.vx>0?SPR.flyF:SPR.fly),dx,dy);

    }
  },
  boss:{
    upd(e,p){
      if(e.dead){e.dead++;if(e.dead%4<2)burst(e.x+Math.random()*e.w,e.y+Math.random()*e.h,PAL.M,3,2);
        if(e.dead===2){exitOpen=true;SFX.bossDie();burst(exitPos.x+8,exitPos.y+8,PAL.g,16,2.5);}
        if(e.dead>60)e.gone=true; return;}
      e.vy=Math.min(MAXFALL,e.vy+GRAV);
      if(!e.awake){
        // dormido en su lugar hasta que Uvita entra a la arena
        moveSolid(e);
        if(p.x>BOSS_WAKE_X){e.awake=true;e.t=0;bossBanner=90;SFX.bossAppear();burst(e.x+18,e.y+13,PAL.M,16,2.5);}
        return;
      }
      e.t++;
      if(e.inv>0)e.inv--;
      // Cada salto anuncia su dirección. En fase 2 descansa menos, pero sigue avisando.
      if(e.hp<=2&&e.phase===1){e.phase=2;bossBanner=90;e.timer=Math.min(e.timer,32);SFX.fury();}
      if(e.mode==='rest')e.timer--;
      if(e.grounded&&e.mode==='rest'&&e.timer<=0){
        e.mode='windup';e.timer=e.phase===2?18:24;e.targetX=p.x+p.w/2;e.vx=0;
      }else if(e.mode==='windup'&&--e.timer<=0){
        e.mode='air';e.vy=-5.2;e.vx=(e.targetX>e.x+e.w/2?1:-1)*(e.phase===2?1.9:1.35);
        SFX.boss();burst(e.x+18,e.y+e.h,PAL.S,6,1.3);
      }
      const pv=e.vx;
      if(e.mode==='windup'){e.vy=0;e.grounded=true;}else moveSolid(e);
      if(e.hitWall)e.vx=-pv*.8;
      const maxBossX=mapW*TILE-e.w;
      if(e.x<ARENA_L||e.x>maxBossX){e.x=Math.max(ARENA_L,Math.min(maxBossX,e.x));e.vx=-pv;}
      if(e.grounded&&e.mode==='air'){
        e.mode='rest';e.timer=e.phase===2?32:54;e.vx=0;
        shake=Math.max(shake,2);burst(e.x+18,e.y+e.h,PAL.S,5,1.1);
        e.landings++;
        if(e.phase===2||e.landings%2===0){
          const floorY=e.y+e.h-5;
          for(const dir of [-1,1])ents.push({kind:'wave',x:e.x+18+dir*22,y:floorY,w:11,h:5,vx:dir*2.1,life:130});
          notice='¡SALTÁ LA ONDA!';noticeT=75;
        }
      }
      if(e.grounded)e.vx*=.9;
      if(aabb(p,e)){
        // estar ENCIMA del jefe nunca lastima: cayendo = pisotón (daño si no está invulnerable);
        // subiendo (el jefe saltó y la alcanzó desde abajo) = la relanza sin daño
        const encima=(p.y+p.h)<e.y+12;
        if(encima){
          if(p.vy>1&&e.inv<=0){
            e.hp--; e.inv=40; score+=200; SFX.bossHit(p.combo++);
            popup('+200',p.x+5,e.y-16,PAL.y);impact(4,4,3);
            burst(p.x+5,e.y,PAL.M,10,2);
            if(e.hp<=0){e.dead=1;score+=1000;bossBanner=0;impact(10,6,5);popup('+1000',e.x+18,e.y-24,PAL.C);burst(e.x+18,e.y+13,PAL.M,24,3);}
          }
          p.vy=Math.min(p.vy,-5); p.noCut=true;   // rebote siempre (también con el jefe invulnerable): pogo seguro
        } else hurtPlayer(e.x+e.w/2);
      }

    },
    draw(e,dx,dy){
      if(e.dead){ if(e.dead%6<3){ctx.globalAlpha=.7;ctx.drawImage(SPR.boss,dx,dy);ctx.globalAlpha=1;} return;}
      const gl=(e.inv>0&&frame%4<2);
      if(gl){ctx.globalAlpha=.4;}
      const jx=(e.inv>0)?(((frame>>1)&1)?1:-1):0;            // sacudida entera
      const by=e.grounded?-(Math.floor(e.t/12)%2):0;           // respira 1 px solo apoyado
      if(e.mode==='windup'){
        ctx.drawImage(SPR.boss,dx-2,dy+5,40,21);
      }else ctx.drawImage(SPR.boss,dx+jx,dy+by);
      ctx.globalAlpha=1;
      if(e.mode==='windup'){
        const sign=e.targetX>e.x+e.w/2?1:-1;
        textShadow(sign>0?'SALTA >':'< SALTA',dx+18,dy-21,PAL.y,7,'center');
        ctx.fillStyle=PAL.y;ctx.fillRect(dx+3,dy+e.h+1,30,2);
      }
      // barra de vida
      ctx.fillStyle='#000';ctx.fillRect(dx+2,dy-8,32,4);
      ctx.fillStyle=e.phase===2?PAL.y:PAL.M;ctx.fillRect(dx+3,dy-7,Math.max(0,Math.round(30*(e.hp/BOSS_HP))),2);

    }
  }
};

// ---------- Loop ----------
let last=0, acc=0;
function loop(t){
  requestAnimationFrame(loop);
  const dt=Math.min(50,t-last); last=t; acc+=dt;
  while(acc>=1000/60){ update(); acc-=1000/60; }
  render();
}
requestAnimationFrame(loop);

  };
